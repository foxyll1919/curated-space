<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F7F4EE" id="theme-color" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap"
    />
    <meta
      name="description"
      content="Curated Space — a personal library of saved screenshots, described and tagged as you save them."
    />
    <title>Curated Space</title>
    <script>
      // Applied before first paint so the page never flashes the wrong theme.
      try {
        const stored = localStorage.getItem('curated-space-theme')
        const dark =
          stored === 'dark' ||
          (stored !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.classList.toggle('light', !dark)
        // The stored theme can disagree with the OS, so the browser UI is told
        // the same answer rather than left to guess from prefers-color-scheme.
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', dark ? '#0F0F13' : '#F7F4EE')
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
