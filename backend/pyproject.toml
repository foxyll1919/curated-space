[project]
name = "curated-space-backend"
version = "0.1.0"
description = "Backend API for the Curated Space screenshot library"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2",
    "curated-ml",
    "fastapi>=0.115,<1",
    "google-genai>=1.0,<3",
    "joblib>=1.4,<2",
    "pandas>=2.2,<4",
    "pillow>=10,<13",
    "pydantic-settings>=2.6,<3",
    "python-multipart>=0.0.18,<1",
    "scikit-learn>=1.5,<2",
    "sqlalchemy>=2,<3",
    "uvicorn[standard]>=0.32,<1",
]

# One editable copy of curated_ml, imported by both ml/train.py and the backend,
# so build_text() has exactly one implementation.
[tool.uv.sources]
curated-ml = { path = "../ml", editable = true }

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "mypy>=1.13,<2",
    "pytest>=8.3,<10",
    "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
markers = [
    "live: hits the real Gemini API; requires GEMINI_API_KEY and is skipped without one",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Archived DistilBERT-era experiments, kept for reference only.
extend-exclude = ["../ml/legacy"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib.*"]
ignore_missing_imports = true
